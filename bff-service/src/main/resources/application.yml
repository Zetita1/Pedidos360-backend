server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: bff-service
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

# Parametros del IDaaS (Microsoft Entra ID). El BFF aplica exactamente las mismas
# validaciones que el JWT authorizer del AWS API Gateway: firma, issuer, audiencia y vigencia.
pedidos360:
  security:
    issuer: ${ENTRA_ISSUER:https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0}
    jwk-set-uri: ${ENTRA_JWKS_URI:}
    tenant-id: ${ENTRA_TENANT_ID:}
    audiences: ${ENTRA_API_AUDIENCE:api://pedidos360-api}
    required-scopes: ${ENTRA_REQUIRED_SCOPES:}
    clock-skew-seconds: 60
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  servicios:
    pedidos-url: ${MS_PEDIDOS_URL:http://localhost:8081}
    productos-url: ${MS_PRODUCTOS_URL:http://localhost:8082}
    clientes-url: ${MS_CLIENTES_URL:http://localhost:8083}
    connect-timeout: 3s
    read-timeout: 8s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    cl.duoc.pedidos360: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

---
spring:
  config:
    activate:
      on-profile: local

---
# En AWS el BFF corre en EC2 detras del API Gateway y llama a los microservicios por su DNS interno.
spring:
  config:
    activate:
      on-profile: aws

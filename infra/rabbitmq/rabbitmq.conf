# Formacion del cluster por configuracion declarativa: cada nodo sabe de antemano quienes
# son sus pares, asi que el cluster se arma al arrancar sin ejecutar join_cluster a mano.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Si un nodo se reinicia y el otro aun no responde, espera en vez de arrancar solo y
# quedar particionado.
cluster_formation.discovery_retry_limit = 20
cluster_formation.discovery_retry_interval = 3000

# Reconciliacion automatica si los nodos se pierden de vista entre si.
cluster_partition_handling = autoheal

# Consola web y API de gestion.
management.tcp.port = 15672

# El disco se considera lleno bajo este umbral; evita que el broker se bloquee en una
# instancia pequena como la del laboratorio.
disk_free_limit.absolute = 500MB

# Arquitectura Kafka de Pedidos360: tres nodos Zookeeper y tres brokers.
#
#   docker compose -f infra/kafka/docker-compose.yml up -d
#   docker exec pedidos360-kafka1 kafka-broker-api-versions --bootstrap-server kafka1:29092
#
# Por que tres de cada uno:
#
#   Zookeeper mantiene el metadato del cluster (que brokers estan vivos, quien es el
#   controlador, quien lidera cada particion) y decide por mayoria. Con tres nodos la mayoria
#   es dos, asi que el ensemble sobrevive la caida de uno. Con dos nodos la mayoria seria dos
#   tambien: perder uno dejaria al cluster sin quorum, que es peor que tener un solo nodo.
#
#   Tres brokers permiten factor de replicacion 3 con min.insync.replicas=2: cada particion
#   tiene un lider y dos seguidores, y la escritura se confirma cuando dos replicas la tienen.
#   Asi se puede perder un broker sin perder datos y sin dejar de escribir.
#
# Los heaps estan acotados a proposito (512 MB por broker, 256 MB por nodo Zookeeper) para que
# los seis contenedores convivan con el resto del sistema en un equipo de desarrollo.
name: pedidos360-kafka

x-zookeeper-comun: &zookeeper-comun
  image: confluentinc/cp-zookeeper:7.5.3
  restart: unless-stopped
  environment: &zookeeper-entorno
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 10
    ZOOKEEPER_SYNC_LIMIT: 5
    # El ensemble completo, igual en los tres nodos: cada uno se reconoce por su id.
    ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
    KAFKA_HEAP_OPTS: -Xms128M -Xmx256M
  networks: [kafka]

x-broker-comun: &broker-comun
  image: confluentinc/cp-kafka:7.5.3
  restart: unless-stopped
  depends_on: [zk1, zk2, zk3]
  networks: [kafka]
  environment: &broker-entorno
    KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
    # Dos listeners: INTERNAL para el trafico entre contenedores, EXTERNAL para los
    # microservicios que corren fuera de Docker. El cliente recibe la direccion del listener
    # por el que llego, de modo que ambos resuelven al mismo broker.
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    # Replicacion de los topicos internos de Kafka: si se dejan en 1, el cluster pierde el
    # registro de offsets al caer el broker que los tenia.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    # Los topicos del proyecto se declaran explicitamente (desde la aplicacion o con
    # crear-topicos.sh) para fijar particiones, replicas y retencion de cada flujo. Crearlos
    # al vuelo daria los valores por defecto sin que nadie lo note.
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: -Xms256M -Xmx512M

services:
  zk1:
    <<: *zookeeper-comun
    container_name: pedidos360-zk1
    hostname: zk1
    environment:
      <<: *zookeeper-entorno
      ZOOKEEPER_SERVER_ID: 1
    ports: ['2181:2181']
    volumes:
      - zk1-datos:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log

  zk2:
    <<: *zookeeper-comun
    container_name: pedidos360-zk2
    hostname: zk2
    environment:
      <<: *zookeeper-entorno
      ZOOKEEPER_SERVER_ID: 2
    ports: ['2182:2181']
    volumes:
      - zk2-datos:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log

  zk3:
    <<: *zookeeper-comun
    container_name: pedidos360-zk3
    hostname: zk3
    environment:
      <<: *zookeeper-entorno
      ZOOKEEPER_SERVER_ID: 3
    ports: ['2183:2181']
    volumes:
      - zk3-datos:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log

  kafka1:
    <<: *broker-comun
    container_name: pedidos360-kafka1
    hostname: kafka1
    environment:
      <<: *broker-entorno
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
    ports: ['9092:9092']
    volumes: [kafka1-datos:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka1:29092']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka2:
    <<: *broker-comun
    container_name: pedidos360-kafka2
    hostname: kafka2
    environment:
      <<: *broker-entorno
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093
    ports: ['9093:9093']
    volumes: [kafka2-datos:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka2:29092']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka3:
    <<: *broker-comun
    container_name: pedidos360-kafka3
    hostname: kafka3
    environment:
      <<: *broker-entorno
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9094
    ports: ['9094:9094']
    volumes: [kafka3-datos:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka3:29092']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  zk1-datos:
  zk1-log:
  zk2-datos:
  zk2-log:
  zk3-datos:
  zk3-log:
  kafka1-datos:
  kafka2-datos:
  kafka3-datos:

networks:
  # Nombre fijo para que el compose de Kafka UI, que es un archivo aparte, pueda engancharse
  # a esta misma red declarandola como externa.
  kafka:
    name: pedidos360-kafka
    driver: bridge

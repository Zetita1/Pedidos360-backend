server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: ms-analitica
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  # Cluster de streaming: tres brokers. Basta uno accesible para descubrir el cluster
  # completo, pero se listan los tres para que el arranque no dependa de cual este arriba.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
    client-id: ms-analitica
    consumer:
      # Cada listener declara su propio grupo; este es el valor por omision.
      group-id: ${KAFKA_GRUPO_ANALITICA:pedidos360-analitica-ventas}
      # Los deserializers tambien se declaran aqui, que es el contrato del cliente; las
      # fabricas de pedidos360-common-streaming instancian estos mismos apuntando al DTO
      # exacto de cada topico y con el ObjectMapper de la aplicacion.
      # El tipo que se deserializa no se configura aqui: cada fabrica de
      # pedidos360-common-streaming construye su JsonDeserializer apuntando al DTO exacto de
      # su topico y con las cabeceras de tipo ignoradas. Es mas estricto que una lista de
      # paquetes confiables, porque el mensaje no puede influir en que clase se instancia.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      # Un grupo nuevo lee desde el principio: es lo que permite reconstruir la proyeccion de
      # stock completa desde el topico compactado sin tocar la base de datos.
      auto-offset-reset: earliest
      # El offset no se confirma al recibir sino al terminar de procesar (ack-mode: record).
      # Si el consumidor muere a mitad de camino, el registro se vuelve a entregar y la
      # idempotencia evita que se cuente dos veces.
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        isolation.level: read_committed
        # Si el consumidor no late en 45 s, el grupo lo da por caido y reasigna sus
        # particiones a los demas. max.poll.interval deja margen para procesar un lote lento
        # sin provocar un reequilibrio innecesario.
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      compression-type: lz4
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        max.block.ms: 5000
    listener:
      ack-mode: record
      type: single
      # Si un topico todavia no existe, el contenedor espera en vez de impedir el arranque.
      missing-topics-fatal: false
    admin:
      fail-fast: false
      operation-timeout: 10s
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false

# Parametros del IDaaS (Microsoft Entra ID). En EC2 se inyectan por variables de entorno
# o por AWS Systems Manager Parameter Store; nunca se versionan valores reales.
pedidos360:
  security:
    # Valor exacto del claim iss, leido de /.well-known/openid-configuration del tenant.
    # Ojo: el issuer usa el tenantId como subdominio, el JWKS usa el subdominio del tenant.
    issuer: ${ENTRA_ISSUER:https://9d265688-dbb5-4a46-9b9a-8f6765928aa0.ciamlogin.com/9d265688-dbb5-4a46-9b9a-8f6765928aa0/v2.0}
    jwk-set-uri: ${ENTRA_JWKS_URI:https://pedidos360duocuc.ciamlogin.com/9d265688-dbb5-4a46-9b9a-8f6765928aa0/discovery/v2.0/keys}
    tenant-id: ${ENTRA_TENANT_ID:9d265688-dbb5-4a46-9b9a-8f6765928aa0}
    # Entra emite el aud como el App ID URI o como el client ID de la API segun el caso;
    # se aceptan las variantes validas para este registro y ninguna otra.
    audiences: ${ENTRA_API_AUDIENCE:api://pedidos360-api,api://e25c9a50-e056-4401-a2ef-f2d8fdefb77b,e25c9a50-e056-4401-a2ef-f2d8fdefb77b}
    required-scopes: ${ENTRA_REQUIRED_SCOPES:}
    clock-skew-seconds: 60
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  # Topicos, grupos y politicas del streaming: unica fuente de verdad de Kafka.
  streaming:
    particiones: ${KAFKA_PARTICIONES:3}
    replicas: ${KAFKA_REPLICAS:3}
    replicas-en-sincronia: ${KAFKA_MIN_ISR:2}
    sufijo-dlt: ${KAFKA_SUFIJO_DLT:.dlt}
    max-intentos: ${KAFKA_MAX_INTENTOS:3}
    espera-reintento-ms: ${KAFKA_ESPERA_REINTENTO_MS:1000}
    # Un consumidor por particion: los tres procesan en paralelo.
    consumidores: ${KAFKA_CONSUMIDORES:3}
    retencion-pedidos-ms: ${KAFKA_RETENCION_PEDIDOS_MS:604800000}
    retencion-descarte-ms: ${KAFKA_RETENCION_DESCARTE_MS:1209600000}
    topicos:
      pedidos: ${KAFKA_TOPICO_PEDIDOS:pedidos360.pedidos.eventos}
      stock: ${KAFKA_TOPICO_STOCK:pedidos360.inventario.stock}
    grupos:
      analitica-ventas: ${KAFKA_GRUPO_ANALITICA:pedidos360-analitica-ventas}
      proyeccion-stock: ${KAFKA_GRUPO_STOCK:pedidos360-proyeccion-stock}
      archivo-pedidos: ${KAFKA_GRUPO_ARCHIVO:pedidos360-archivo-pedidos}

  analitica:
    # Unidades a partir de las cuales el consumidor genera el aviso de stock.
    umbral-stock-critico: ${ANALITICA_UMBRAL_STOCK:10}
    # Los eventos viajan en UTC; el dia del negocio se cuenta en hora local.
    zona-horaria: ${ANALITICA_ZONA:America/Santiago}
    dias-tablero: ${ANALITICA_DIAS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    cl.duoc.pedidos360: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

---
# Perfil de desarrollo local: base H2 en memoria, sin dependencia de la nube.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:analitica;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

---
# Perfil productivo en AWS: PostgreSQL gestionado (Amazon RDS) + migraciones Flyway.
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidos360}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
# Perfil de pruebas: sin cluster. Los listeners no arrancan, no se declaran topicos y los
# tests llaman a los servicios de negocio directamente.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:analitica-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false

pedidos360:
  streaming:
    declarar-topicos: false
